  <text x="168" y="126" fill="#79818E" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="15">εἶδος · the form — bounded emission without halving · federated consensus · hash-only signatures</text>
  <text x="168" y="150" fill="#C9A227" font-family="ui-monospace, 'IBM Plex Mono', Consolas, monospace" font-size="13">testnet, no value · oykdo.github.io/Eidos</text>
