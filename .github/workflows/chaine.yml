name: chaine

# Le nœud d'Eidos. Se réveille à la minute 7 de chaque heure, rejoue la
# chaîne, forge les créneaux échus (six au plus), revalide, puis publie.
# À déposer dans .github/workflows/chaine.yml

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Même groupe que robinet.yaml : jamais deux écritures simultanées
# sur chaine-eidos.dat.
concurrency:
  group: chaine
  cancel-in-progress: false

jobs:
  forger:
    # La forge n'a de sens que sur la branche publiée : un workflow_dispatch sur
    # une autre branche signerait avec les mêmes clés, hors de vue de main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Genèse reproductible
        run: python3 verify_genesis.py

      - name: Initialiser la chaîne si elle est absente
        run: |
          if [ ! -f chaine-eidos.dat ]; then
            python3 noeud.py --init
          else
            echo "chaine-eidos.dat existe déjà"
          fi

      # L'état MSS persistant (indice-<v>.json) ne vit pas dans le dépôt : il
      # passe d'une exécution à l'autre par le cache. Meilleur effort : perdu,
      # le nœud repart de la chaîne, ce qui est sûr pour un seul écrivain.
      # Clé par génération de fédération (federation.json) : une réinitialisation
      # (§6) change les racines, donc le préfixe, et l'ancien état ne revient pas.
      - name: Restaurer l'etat MSS persistant
        uses: actions/cache/restore@v4
        with:
          path: indice-*.json
          key: indice-${{ hashFiles('federation.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indice-${{ hashFiles('federation.json') }}-

      # Sans état alors que la chaîne a des blocs, le nœud refuse : on amorce
      # explicitement, et ça se lit dans le journal du run. Un état PARTIEL
      # (moins de fichiers que de validateurs) vaut absence : les blocs forgés
      # hors CI (§6, --init && --forger sur un poste) laissent leurs fichiers
      # sur ce poste, et le nœud refuserait chaque créneau de ces validateurs.
      # --amorcer-indice ne touche que les validateurs sans fichier ; les
      # autres gardent max(chaîne, fichier).
      - name: Forger
        env:
          # boîte aux lettres du robinet, publiée dans etat.json (courriel.py)
          EIDOS_ROBINET_COURRIEL: ${{ vars.EIDOS_ROBINET_COURRIEL }}
        run: |
          n=$(python3 -c "import json; print(json.load(open('federation.json'))['n'])")
          presents=$(ls indice-*.json 2>/dev/null | wc -l)
          if [ "$presents" -ge "$n" ]; then
            python3 noeud.py --forger
          else
            echo "::warning::état MSS persistant incomplet ($presents/$n fichiers) — amorçage explicite depuis la chaîne pour les validateurs sans fichier"
            python3 noeud.py --forger --amorcer-indice
          fi

      - name: Rejeu de contrôle
        run: python3 noeud.py --verifier

      - name: Publier
        run: |
          git config user.name  "eidos-noeud"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in chaine-eidos.dat etat.json mempool.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "rien à publier"
            exit 0
          fi
          git commit -m "noeud : forge du $(date -u +%FT%TZ)"
          git push || { git pull --rebase --autostash && git push; }

      - name: Sauver l'etat MSS persistant
        if: always()
        uses: actions/cache/save@v4
        with:
          path: indice-*.json
          key: indice-${{ hashFiles('federation.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
