name: init-federation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Calculer les sept racines de validateur
        run: |
          python - <<'PY'
          import hashlib, json, os, sys, time
          sys.path.insert(0, ".")
          import federation as F

          if os.path.exists("chaine-eidos.dat"):
              sys.exit("REFUS : chaine-eidos.dat existe deja. Regenerer les "
                       "racines invaliderait tous les blocs deja signes.")

          # GRAINE doit etre egal a noeud.GRAINE ; hauteur 12 = 4096 signatures
          # par validateur, ~40 s de generation par cle.
          N, HAUTEUR, GRAINE = 7, 12, "eidos-testnet-3"
          t = time.time()
          racines, graines_pub = [], []
          for i in range(N):
              s = hashlib.sha256(f"{GRAINE}/validateur/{i}".encode()).digest()
              k = F.CleValidateur(s, HAUTEUR)
              racines.append(k.racine.hex()); graines_pub.append(k.graine_pub.hex())
              print(f"validateur {i} : {racines[-1]}  ({time.time() - t:.0f} s)")

          import datetime
          now = int(time.time()); t0 = now - now % 3600
          cfg = {
           "spec": "eidos-federation/2",
           "reseau": "essai",
           "n": N,
           "signatures": "XMSS — WOTS+ w=16, SHA-256, arbre L, RFC 8391 (wots.py, federation.py)",
           "hauteur_mss": HAUTEUR,
           "signatures_par_cle": 1 << HAUTEUR,
           "creneau_s": 3600,
           "pas_rotation": 3,
           "t0_unix": t0,
           "t0_iso": datetime.datetime.fromtimestamp(t0, datetime.timezone.utc)
                      .isoformat().replace("+00:00", "Z"),
           "derivation_graines": f"sha256('{GRAINE}/validateur/<i>')",
           "graine_publique": "sha256(graine || 'pub')",
           "format_chaine": 2,
           "avertissement": "Reseau d'essai : graines publiques, aucune valeur.",
           "racines": racines,
           "graines_publiques": graines_pub,
          }
          json.dump(cfg, open("federation.json", "w"), indent=1, ensure_ascii=False)
          print(f"\nfederation.json ecrit en {time.time()-t:.1f} s")
          PY

      - name: Publier federation.json
        run: |
          git config user.name  "eidos-noeud"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add federation.json
          if git diff --cached --quiet; then
            echo "federation.json inchange"
            exit 0
          fi
          git commit -m "federation.json : sept racines de validateur"
          git push
