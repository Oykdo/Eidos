name: labo
# Laboratoire pendule-9 : aura, avatar voxelisé, agrégateurs, unification.
# Hors chaîne : ne touche ni chaine-eidos.dat, ni etat.json, ni mempool.json (groupe de concurrence distinct).
on:
  push:
    branches: [main]
    paths: ["labo/**", "docs/SPEC_AURA_PENDULE9.md", ".github/workflows/labo.yml", "atelier/scripts/exporter-run.ts", "atelier/scripts/exporter-veillee.ts", "atelier/scripts/exporter-signatures.ts", "atelier/src/lib/eidos/signatures.ts", "atelier/src/lib/eidos/voxels.ts", "atelier/src/lib/eidos/pendule.ts", "atelier/src/lib/eidos/tour.ts", "atelier/src/lib/eidos/veillee.ts", "atelier/src/lib/eidos/veillee-tour.ts", "atelier/src/lib/eidos/veillee-bot.ts", "vecteurs.json", "docs/SPEC_COFFRE_HORAIRE.md", "chaine-eidos.dat", "etat.json"]
  pull_request:
    paths: ["labo/**", "docs/SPEC_AURA_PENDULE9.md", ".github/workflows/labo.yml", "atelier/scripts/exporter-run.ts", "atelier/scripts/exporter-veillee.ts", "atelier/scripts/exporter-signatures.ts", "atelier/src/lib/eidos/signatures.ts", "atelier/src/lib/eidos/voxels.ts", "atelier/src/lib/eidos/pendule.ts", "atelier/src/lib/eidos/tour.ts", "atelier/src/lib/eidos/veillee.ts", "atelier/src/lib/eidos/veillee-tour.ts", "atelier/src/lib/eidos/veillee-bot.ts", "vecteurs.json", "docs/SPEC_COFFRE_HORAIRE.md", "chaine-eidos.dat", "etat.json"]
  workflow_dispatch:
concurrency:
  group: labo-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  kill-criteria:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: K1–K9 aura / avatar (grille alignée sur voxels.ts)
        run: python labo/aura_voxel_lab.py
      - name: K11–K17, K27–K28, K37–K38 run de l'atelier, Cube, muses
        run: python labo/pendule9_run.py
      - name: K19–K26 unification
        run: python labo/unification.py
      - name: K29–K36 aura de la veillée (bot et veillée jouée)
        run: python labo/aura_veillee.py
      - name: K39–K46 coffre horaire sur les vraies têtes du testnet
        run: python labo/coffre_horaire.py
      - name: hygiène — la fixture régénérée est identique au dépôt
        shell: bash
        run: git diff --exit-code -- labo/run_fixture.json
      - name: hygiène — bibliothèque standard seulement
        shell: bash
        run: |
          ! grep -rEn "^(import|from) (numpy|scipy|pandas|requests)" labo/ || (echo "dépendance hors stdlib" && exit 1)
  parite-atelier:
    # Parité réelle pendule.ts → labo : l'atelier exporte un run, le labo le lit,
    # et l'export doit être identique à l'octet à labo/run_atelier.json (fixture réelle).
    runs-on: ubuntu-latest
    needs: kill-criteria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: atelier/package-lock.json }
      - working-directory: atelier
        run: npm ci --no-audit --no-fund
      - name: exporter un run réel
        run: node --experimental-strip-types atelier/scripts/exporter-run.ts labo 0 labo > run_atelier.json
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: le labo lit l'export
        run: python labo/unification.py run_atelier.json
      - name: hygiène — la fixture réelle est identique à l'export
        run: cmp run_atelier.json labo/run_atelier.json
      - name: hygiène — la table des muses vient de signatures.ts
        run: |
          node --experimental-strip-types atelier/scripts/exporter-signatures.ts > muses.json
          cmp muses.json labo/muses.json
      - name: exporter une veillée réelle (bot gourmand, graine 7)
        run: node --experimental-strip-types atelier/scripts/exporter-veillee.ts 7 > veillee_atelier.json
      - name: le labo lit la veillée
        run: python labo/aura_veillee.py veillee_atelier.json
      - name: hygiène — la veillée du bot est identique à l'export
        run: cmp veillee_atelier.json labo/veillee_atelier.json
      - name: relire une veillée vraiment jouée (--depuis) et la comparer à sa lecture filée
        run: |
          node --experimental-strip-types atelier/scripts/exporter-veillee.ts --depuis labo/veillee_jouee_source.json > jouee.json
          cmp jouee.json labo/veillee_jouee.json
          python labo/aura_veillee.py labo/veillee_jouee.json
