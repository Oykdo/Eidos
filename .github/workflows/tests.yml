name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  suites:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Genese reproductible (32 controles)
        run: python verify_genesis.py

      - name: Emission et codec (6 controles)
        run: python eonis.py

      - name: Signatures WOTS+ et arbre L (5 controles)
        run: python wots.py

      - name: Carnet UTXO, temoins WOTS+, racine UTXO (15 controles)
        run: python utxo.py

      - name: Vecteurs partages Python <-> TS
        run: python vecteurs.py

      - name: Robinet (file, carnet, budget)
        run: python robinet.py --test

      - name: Artefacts robinet (œufs Paracelse)
        run: python -c "import noeud as N; N._test_artefact()"

      - name: Envois (inclusion, double depense, malforme, expiration, 5 controles)
        run: python -c "import noeud as N; N._test_envois()"

      - name: Reprise --depuis (point de controle explicite, 4 controles)
        run: python -c "import noeud as N; N._test_depuis()"

      - name: Reliques (attente, intacte, recuperee, 4 controles)
        run: python -c "import noeud as N; N._test_reliques()"

      - name: Encodeur QR (5 controles)
        run: python qr.py --test

      - name: Gardien des reliques (3 controles)
        run: python relique.py --test

      - name: Difficulte et travail cumule (6 controles)
        run: python consensus.py

      - name: Consensus federe XMSS (vivacite, tete signee, 16 controles)
        run: python federation.py

      - name: Persistance, aller-retour complet
        shell: bash
        run: |
          python store.py --init
          python store.py --mine 2
          python store.py --pay
          python store.py --verify

  parite:
    name: parite Python <-> TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: atelier/package-lock.json

      - name: vecteurs.json relu par la spec Python
        run: python vecteurs.py

      - name: Atelier - dependances
        run: npm ci
        working-directory: atelier

      - name: Atelier - typage
        run: npm run typecheck
        working-directory: atelier

      - name: Atelier - tests (vecteurs.json relu par TypeScript)
        run: npm test
        working-directory: atelier

  empreintes:
    name: empreinte ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Calculer l'empreinte des quatre tables
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, eonis as E
          lines = []
          for nom, a, _ in E.AGES:
              W = E.build_epoch_table(a)
              blob = ("\n".join(str(x) for x in W) + "\n").encode("ascii")
              lines.append(f"{nom} {hashlib.sha256(blob).hexdigest()}")
          open("empreinte.txt", "w", newline="\n", encoding="ascii").write(
              "\n".join(lines) + "\n"
          )
          PY
          cat empreinte.txt

      - uses: actions/upload-artifact@v4
        with:
          name: empreinte-${{ matrix.os }}
          path: empreinte.txt

  comparaison:
    name: determinisme inter-plateformes
    needs: empreintes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: empreintes

      - name: Les trois systemes doivent produire le meme texte
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          texts = []
          for p in sorted(Path("empreintes").rglob("empreinte.txt")):
              t = p.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              print("---", p)
              print(t.decode("ascii"), end="")
              texts.append(t)
          if len(texts) < 3:
              raise SystemExit(f"ECHEC : {len(texts)} artefact(s), 3 attendus.")
          if len(set(texts)) != 1:
              raise SystemExit("ECHEC : les tables different selon la plateforme.")
          print("OK : empreintes identiques sur les trois systemes.")
          PY

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: eonis.py doit correspondre a la genese
        run: |
          python - <<'PY'
          import hashlib, json, sys
          g = json.load(open("genesis.json"))
          d = hashlib.sha256(
              open("eonis.py", "rb").read().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          ).hexdigest()
          attendu = g["generation_des_tables"]["generateur_sha256"]
          print("calcule ", d)
          print("declare ", attendu)
          if d != attendu:
              sys.exit("ECHEC : eonis.py a change, la genese est invalidee.")
          print("OK")
          PY

      - name: Aucun etat local versionne
        shell: bash
        run: |
          for f in chaine.dat portefeuille.json; do
            if [ -e "$f" ]; then
              echo "ECHEC : $f ne doit pas etre versionne."
              exit 1
            fi
          done
          echo "OK : depot propre."
