name: chaine

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chaine
  cancel-in-progress: false

jobs:
  forger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Creer la chaine si elle n'existe pas
        run: |
          if [ ! -f chaine-eidos.dat ]; then python noeud.py --init; fi

      - name: Forger les blocs des creneaux echus
        run: python noeud.py --forger

      - name: Rejeu integral de controle
        run: python noeud.py --verifier

      - name: Publier
        run: |
          git config user.name  "eidos-noeud"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f chaine-eidos.dat etat.json
          if git diff --cached --quiet; then
            echo "aucun changement"
            exit 0
          fi
          H=$(python -c "import json;print(json.load(open('etat.json'))['hauteur'])")
          git commit -m "bloc $H"
          git push
